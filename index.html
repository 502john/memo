<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Memo</title>
  <meta name="description" content="Memorize any text: read it aloud, then type or say it with fewer and fewer hints.">
  <!-- Only this site's own files may load. Inline styles are allowed because
       components set CSS variables through style attributes. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; manifest-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#323437">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Everything inside #app is drawn by src/components.js. -->
  <div id="app"></div>

  <!-- Invisible field that receives typing during practice. It sits outside
       #app so re-renders never take its focus away. -->
  <input id="keyboard" class="visually-hidden" aria-label="Type here"
         autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">

  <noscript>Memo needs JavaScript to run.</noscript>
  <script type="module" src="src/app.js"></script>
</body>
</html>
